name: An idea
description: Something Everlook could do, or do better.
labels: ["idea"]
body:
  - type: textarea
    id: want
    attributes:
      label: What you would like
      description: What you are trying to do in the game, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How you do it now
      description: Another addon, a macro, or by hand.
