name: addon-tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: addon-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  addon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.26"
      - name: Run tests
        run: |
          lua5.1 tests/run.lua
          python3 tests/scripts_test.py
          python3 tests/luac_test.py
          (cd scripts && python3 -m unittest risky_uses_test)
      - name: Lines that need a second look
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${BASE}"
          git diff FETCH_HEAD HEAD | python3 scripts/risky_uses.py --profile addon >> "${GITHUB_STEP_SUMMARY}"
